<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>zoo</title>
<style>
/* ============================================================
   zoo — Party-Animals 风格【桌面端】聊天原型
   单文件 / 自包含 / 全交互 / 3D 角色头像(Fluent 3D emoji，离线回退 emoji)
   ============================================================ */
:root{
  --bg1:#ffd06b; --bg2:#ff9e3d; --bg3:#f5822a;
  --panel:#fff8ec; --panel-2:#fffdf7; --cream:#fff3e0;
  --yellow:#ffce3d; --yellow-d:#e8a900;
  --green:#84cf4e;  --green-d:#5fa838;
  --blue:#5b9bf0;   --blue-d:#3f7ed1;
  --pink:#ff7fa3;
  --ink:#5a4030; --ink-soft:#a98e76; --line:rgba(140,90,50,.12);
  --bubble-me:linear-gradient(135deg,#ffd05a 0%,#ff9b4d 100%);
  --shadow-panel:0 24px 60px rgba(120,60,20,.30);
  --shadow-card:0 10px 26px rgba(150,90,40,.18);
}
*{margin:0;padding:0;box-sizing:border-box;
  font-family:'Nunito','PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{display:flex;justify-content:center;align-items:center;background:#caa56a;overflow:hidden;color:var(--ink);}
button{cursor:pointer;border:none;outline:none;background:none;font:inherit;color:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:rgba(150,90,40,.25);border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

/* 窗口外壳 */
.window{position:relative;width:min(1180px,98vw);height:min(760px,96vh);border-radius:22px;overflow:hidden;
  box-shadow:0 50px 110px rgba(80,40,10,.55);display:flex;flex-direction:column;
  background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.35),transparent 55%),
             linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 50%,var(--bg3) 100%);}
.titlebar{height:44px;flex-shrink:0;display:flex;align-items:center;gap:12px;padding:0 16px;background:rgba(120,60,20,.16);}
.tb-dots{display:flex;gap:8px;}
.tb-dots i{width:13px;height:13px;border-radius:50%;display:block;box-shadow:inset 0 -2px 3px rgba(0,0,0,.15);}
.tb-dots .r{background:#ff6159;}.tb-dots .y{background:#ffbd2e;}.tb-dots .g{background:#28c840;}
.tb-logo{font-size:21px;font-weight:900;color:#fff;text-shadow:0 3px 0 rgba(200,90,30,.5);letter-spacing:2px;}
.tb-spacer{flex:1;}
.tb-win{display:flex;gap:14px;color:rgba(255,255,255,.85);font-size:14px;}
.tb-win span{cursor:pointer;}
.stage{flex:1;position:relative;overflow:hidden;}

/* ===== 3D 头像 ===== */
.av{position:relative;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:radial-gradient(circle at 36% 28%,#ffffff 0%,var(--c1,#ffd36b) 42%,var(--c2,#ff9f43) 100%);
  box-shadow:0 7px 16px rgba(150,90,50,.35),inset 0 -6px 11px rgba(120,60,20,.22),inset 0 5px 9px rgba(255,255,255,.6);}
.av img{width:86%;height:86%;object-fit:contain;position:relative;z-index:2;filter:drop-shadow(0 3px 3px rgba(120,60,20,.3));}
.av .fb{position:relative;z-index:2;line-height:1;filter:drop-shadow(0 2px 2px rgba(120,60,20,.35));}
.av-xl{width:108px;height:108px;}.av-xl .fb{font-size:54px;}
.av-lg{width:58px;height:58px;}.av-lg .fb{font-size:31px;}
.av-md{width:48px;height:48px;}.av-md .fb{font-size:26px;}
.av-sm{width:38px;height:38px;}.av-sm .fb{font-size:21px;}
.av-sq{border-radius:24px;}
.c-cat{--c1:#ffe08a;--c2:#ff9f1c;}.c-dog{--c1:#ffd2a8;--c2:#ff9a4d;}.c-wolf{--c1:#dceff5;--c2:#86bfd3;}
.c-croc{--c1:#c8f7c5;--c2:#5bbf5b;}.c-bear{--c1:#ffd9a8;--c2:#cf8a44;}.c-bunny{--c1:#ffd6ef;--c2:#ff8fd0;}
.c-pig{--c1:#ffd0e0;--c2:#ff89b0;}.c-tiger{--c1:#ffd27a;--c2:#f08a2c;}.c-fox{--c1:#ffd0a0;--c2:#ff8a3d;}

/* ===== 胶囊按钮 ===== */
.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 22px;border-radius:18px;
  font-weight:900;font-size:15px;color:#fff;transition:transform .08s,box-shadow .08s;white-space:nowrap;}
.pill:active{transform:translateY(3px);}
.pill.yellow{background:var(--yellow);color:#7a5310;box-shadow:0 5px 0 var(--yellow-d),0 10px 16px rgba(180,120,0,.3);}
.pill.yellow:active{box-shadow:0 2px 0 var(--yellow-d);}
.pill.green{background:var(--green);box-shadow:0 5px 0 var(--green-d),0 10px 16px rgba(80,140,30,.3);}
.pill.green:active{box-shadow:0 2px 0 var(--green-d);}
.pill.cream{background:#fff;color:var(--ink);box-shadow:0 5px 0 #e9d6bf,0 10px 16px rgba(150,90,40,.18);}
.pill.cream:active{box-shadow:0 2px 0 #e9d6bf;}

/* ===== 登录 ===== */
#login{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:60px;transition:opacity .5s;}
.blob{position:absolute;border-radius:50%;filter:blur(3px);opacity:.45;pointer-events:none;}
.blob.b1{width:320px;height:320px;background:#fff3cf;top:-90px;left:-70px;}
.blob.b2{width:240px;height:240px;background:#ff7a8f;bottom:-60px;right:-40px;opacity:.35;}
.login-hero{display:flex;flex-direction:column;align-items:center;z-index:2;}
.zoo-plaque{background:linear-gradient(180deg,#ffd98a,#f0a23c);border-radius:30px;padding:18px 46px;
  box-shadow:0 12px 0 #c9762a,0 26px 40px rgba(150,70,20,.4);transform:rotate(-2deg);}
.zoo-plaque .w{font-size:84px;font-weight:900;color:#fff;letter-spacing:3px;line-height:1;
  text-shadow:0 6px 0 rgba(200,90,30,.55),0 12px 20px rgba(120,40,10,.3);}
.zoo-plaque .w b{display:inline-block;animation:bob 2.2s ease-in-out infinite;}
.zoo-plaque .w b:nth-child(2){animation-delay:.15s;}.zoo-plaque .w b:nth-child(3){animation-delay:.3s;}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-10px) rotate(-4deg)}}
.zoo-sub{margin-top:30px;color:#fff;font-weight:800;letter-spacing:6px;font-size:15px;text-shadow:0 2px 4px rgba(150,60,10,.4);}
.parade{display:flex;margin-top:24px;}
.parade .av{margin:0 -10px;animation:jelly 2.4s ease-in-out infinite;}
.parade .av:nth-child(2){animation-delay:.2s;}.parade .av:nth-child(3){animation-delay:.4s;}
.parade .av:nth-child(4){animation-delay:.6s;}.parade .av:nth-child(5){animation-delay:.8s;}
@keyframes jelly{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-12px) scale(1.06)}}
.login-card{width:360px;background:var(--panel);border-radius:30px;padding:30px 28px;box-shadow:var(--shadow-panel);z-index:2;}
.login-card h2{font-size:23px;font-weight:900;margin-bottom:4px;}
.login-card .lc-sub{color:var(--ink-soft);font-size:14px;margin-bottom:22px;}
.field{display:flex;align-items:center;gap:11px;background:var(--cream);border-radius:16px;padding:14px 16px;margin-bottom:13px;box-shadow:inset 0 2px 6px rgba(160,100,60,.12);}
.field span{font-size:19px;}
.field input{flex:1;border:none;outline:none;background:none;font-size:15px;color:var(--ink);}
.row-opts{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--ink-soft);margin:6px 2px 20px;}
.row-opts a{color:var(--yellow-d);font-weight:800;text-decoration:none;}
.chk{display:flex;align-items:center;gap:7px;cursor:pointer;}
.chk i{width:18px;height:18px;border-radius:7px;border:2px solid #e3c4ac;display:inline-block;transition:.2s;position:relative;}
.chk.on i{background:var(--green);border-color:var(--green);}
.chk.on i::after{content:'✓';color:#fff;font-size:12px;position:absolute;left:2px;top:-2px;}
.login-card .pill{width:100%;font-size:17px;padding:14px;margin-bottom:8px;}
.signup{text-align:center;font-size:13px;color:var(--ink-soft);margin-top:18px;}
.signup a{color:var(--yellow-d);font-weight:900;text-decoration:none;}

/* ===== 主应用 ===== */
#app{position:absolute;inset:0;display:none;flex-direction:column;}
.app-main{flex:1;display:flex;padding:18px;gap:16px;overflow:hidden;}
.nav-rail{width:84px;flex-shrink:0;background:var(--panel);border-radius:24px;box-shadow:var(--shadow-card);
  display:flex;flex-direction:column;align-items:center;padding:16px 0;}
.nav-rail .me-av{cursor:pointer;margin-bottom:8px;transition:transform .1s;}
.nav-rail .me-av:active{transform:scale(.92);}
.nav-rail .me-name{font-size:11px;font-weight:800;color:var(--ink-soft);margin-bottom:18px;}
.nav-ic{width:54px;height:54px;border-radius:18px;display:flex;align-items:center;justify-content:center;
  font-size:24px;color:var(--ink-soft);margin-bottom:12px;transition:.18s;position:relative;cursor:pointer;}
.nav-ic:hover{background:var(--cream);}
.nav-ic.on{background:var(--yellow);color:#7a5310;box-shadow:0 4px 0 var(--yellow-d);}
.nav-ic .pip{position:absolute;top:6px;right:6px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;
  background:var(--pink);color:#fff;font-size:10px;font-weight:900;display:none;align-items:center;justify-content:center;}
.nav-ic .pip.show{display:flex;}
.nav-grow{flex:1;}

.col-list{width:300px;flex-shrink:0;background:var(--panel);border-radius:24px;box-shadow:var(--shadow-card);
  display:flex;flex-direction:column;overflow:hidden;}
.list-head{padding:18px 20px 10px;display:flex;align-items:center;justify-content:space-between;}
.list-head h2{font-size:20px;font-weight:900;}
.head-add{width:38px;height:38px;border-radius:13px;background:var(--yellow);color:#7a5310;display:flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:900;box-shadow:0 4px 0 var(--yellow-d);transition:transform .08s;}
.head-add:active{transform:translateY(2px);box-shadow:0 2px 0 var(--yellow-d);}
.search{margin:0 16px 8px;display:flex;align-items:center;gap:8px;background:var(--cream);border-radius:14px;padding:10px 14px;}
.search input{flex:1;border:none;outline:none;background:none;font-size:14px;color:var(--ink);}
.list-scroll{flex:1;overflow-y:auto;padding:6px 10px 14px;}
.chat-item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:16px;cursor:pointer;transition:.15s;}
.chat-item:hover{background:var(--cream);}
.chat-item.on{background:var(--yellow);box-shadow:0 4px 0 rgba(232,169,0,.4);}
.ci-mid{flex:1;min-width:0;}
.ci-top{display:flex;justify-content:space-between;align-items:center;}
.ci-name{font-size:15px;font-weight:800;display:flex;align-items:center;gap:5px;}
.ci-time{font-size:11px;color:var(--ink-soft);font-weight:700;}
.ci-prev{font-size:13px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--pink);color:#fff;font-size:11px;font-weight:900;
  display:flex;align-items:center;justify-content:center;box-shadow:0 3px 6px rgba(255,90,120,.4);}
.grp-label{padding:12px 14px 6px;font-size:12px;font-weight:900;color:var(--ink-soft);letter-spacing:1px;}
.contact{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:16px;cursor:pointer;}
.contact:hover{background:var(--cream);}
.contact .nm{font-size:14px;font-weight:800;}
.contact .st{font-size:12px;color:var(--ink-soft);margin-top:1px;}
.signal{display:flex;align-items:flex-end;gap:2px;height:14px;margin-left:auto;}
.signal i{width:3px;border-radius:2px;background:#d8c4b0;}
.signal i:nth-child(1){height:5px;}.signal i:nth-child(2){height:9px;}.signal i:nth-child(3){height:14px;}
.signal.on i{background:var(--green);}

.col-chat{flex:1;background:var(--panel-2);border-radius:24px;box-shadow:var(--shadow-card);display:flex;flex-direction:column;overflow:hidden;position:relative;min-width:0;}
.chat-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--ink-soft);}
.chat-empty .big{font-size:64px;}
.chat-room{flex:1;display:flex;flex-direction:column;min-height:0;}
.chat-head{flex-shrink:0;display:flex;align-items:center;gap:12px;padding:16px 22px;border-bottom:1px solid var(--line);}
.chat-head .ct{flex:1;min-width:0;}
.chat-head .ct .t{font-size:17px;font-weight:900;}
.chat-head .ct .s{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.icon-btn{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--ink-soft);transition:.15s;}
.icon-btn:hover{background:var(--cream);color:var(--ink);}
.msgs{flex:1;overflow-y:auto;padding:22px 26px;display:flex;flex-direction:column;gap:6px;
  background:linear-gradient(180deg,rgba(255,240,220,.5),rgba(255,250,242,.5));}
.time-sep{align-self:center;font-size:11px;color:var(--ink-soft);background:rgba(255,255,255,.7);padding:3px 14px;border-radius:10px;margin:6px 0;}
.msg{display:flex;align-items:flex-end;gap:10px;max-width:72%;animation:pop .3s cubic-bezier(.3,1.4,.5,1);}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.92);}to{opacity:1;transform:none;}}
.msg.them{align-self:flex-start;}
.msg.me{align-self:flex-end;flex-direction:row-reverse;}
.msg .av{cursor:pointer;}
.bubble-wrap{display:flex;flex-direction:column;min-width:0;}
.msg.me .bubble-wrap{align-items:flex-end;}
.sender{font-size:11px;color:var(--ink-soft);margin:0 6px 3px;font-weight:800;}
.bubble{padding:11px 16px;font-size:15px;line-height:1.5;position:relative;word-break:break-word;box-shadow:0 4px 12px rgba(160,100,50,.12);cursor:default;white-space:pre-wrap;}
.msg.them .bubble{background:#fff;color:var(--ink);border-radius:18px 18px 18px 6px;}
.msg.me .bubble{background:var(--bubble-me);color:#fff;font-weight:600;border-radius:18px 18px 6px 18px;box-shadow:0 6px 16px rgba(255,150,60,.35);}
.bubble.flash{animation:flash 1.1s ease;}
@keyframes flash{0%,100%{box-shadow:0 4px 12px rgba(160,100,50,.12);}30%{box-shadow:0 0 0 4px var(--yellow),0 6px 18px rgba(255,180,40,.5);}}
.bubble.file-b{display:flex;align-items:center;gap:12px;min-width:210px;}
.bubble.file-b .fic{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-size:23px;flex-shrink:0;}
.msg.them .bubble.file-b .fic{background:rgba(255,150,60,.16);}
.bubble.img-b{padding:6px;}
.bubble.img-b .ph{width:180px;height:130px;border-radius:14px;background:linear-gradient(135deg,#ffd36b,#ff7eb3);display:flex;align-items:center;justify-content:center;font-size:44px;}
.bubble .tsec{font-size:10px;opacity:.72;margin-top:6px;display:none;}
.bubble.show-time .tsec{display:block;}
.recalled{align-self:center;font-size:12px;color:var(--ink-soft);background:rgba(255,255,255,.6);padding:5px 14px;border-radius:12px;margin:4px 0;}

.input-area{flex-shrink:0;border-top:1px solid var(--line);background:var(--panel);}
.toolbar{display:flex;align-items:center;gap:6px;padding:10px 18px 0;}
.tool-ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:21px;color:var(--ink-soft);transition:.15s;}
.tool-ic:hover{background:var(--cream);transform:translateY(-2px);}
.input-row{display:flex;align-items:flex-end;gap:12px;padding:8px 18px 16px;}
.input-box{flex:1;background:#fff;border-radius:18px;padding:12px 16px;box-shadow:inset 0 2px 6px rgba(160,100,60,.1);}
.input-box textarea{width:100%;border:none;outline:none;background:none;font-size:15px;color:var(--ink);resize:none;line-height:1.45;max-height:132px;overflow-y:auto;font-family:inherit;display:block;}
.send-pill{flex-shrink:0;}
.emoji-pop{position:absolute;bottom:100px;left:18px;width:336px;background:#fff;border-radius:18px;box-shadow:0 18px 40px rgba(120,60,20,.3);padding:12px;display:none;z-index:20;}
.emoji-pop.show{display:block;}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;max-height:200px;overflow-y:auto;}
.emoji-grid button{font-size:24px;padding:6px 0;border-radius:10px;transition:.12s;}
.emoji-grid button:hover{background:var(--cream);transform:scale(1.15);}

/* 右侧信息面板 */
.col-info{width:0;flex-shrink:0;overflow:hidden;transition:width .3s cubic-bezier(.4,1,.5,1);}
.col-info.open{width:288px;}
.info-inner{width:288px;height:100%;background:var(--panel);border-radius:24px;box-shadow:var(--shadow-card);display:flex;flex-direction:column;overflow:hidden;}
.info-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);}
.info-head b{font-size:15px;font-weight:900;}
.info-body{flex:1;overflow-y:auto;padding:18px;}
.gi-hero{display:flex;flex-direction:column;align-items:center;margin-bottom:18px;}
.gi-hero .nm{font-size:19px;font-weight:900;margin-top:12px;}
.gi-remark{margin-top:10px;font-size:13px;color:var(--ink-soft);background:#fff;padding:7px 16px;border-radius:13px;box-shadow:0 3px 8px rgba(150,90,40,.12);cursor:pointer;}
.gi-sec{background:#fff;border-radius:18px;padding:15px;margin-bottom:14px;box-shadow:0 4px 12px rgba(150,90,40,.08);}
.gi-sec .h{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px;}
.gi-sec .h b{font-size:14px;}
.gi-sec .h .e{font-size:15px;color:var(--yellow-d);cursor:pointer;}
.notice-text{font-size:13px;line-height:1.6;color:var(--ink-soft);}
.gi-line{display:flex;align-items:center;gap:12px;padding:11px 4px;font-size:14px;font-weight:700;cursor:pointer;border-radius:12px;}
.gi-line:hover{background:var(--cream);}
.gi-line .gi-ic{font-size:18px;width:22px;text-align:center;}
.gi-line .gi-arr{margin-left:auto;color:var(--ink-soft);}
.gi-line+.gi-line{border-top:1px solid var(--line);}
.gi-line.danger{color:var(--pink);}
.members{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 4px;}
.member{display:flex;flex-direction:column;align-items:center;gap:5px;position:relative;cursor:pointer;}
.member .mn{font-size:11px;color:var(--ink-soft);font-weight:700;max-width:52px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.owner-tag{position:absolute;top:-5px;right:4px;background:var(--yellow);color:#7a5310;font-size:8px;font-weight:900;padding:1px 5px;border-radius:7px;z-index:3;}
.add-member .plus{width:48px;height:48px;border-radius:50%;background:#fff;border:2px dashed var(--green);color:var(--green);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:300;box-shadow:0 4px 10px rgba(100,180,40,.18);transition:transform .1s;}
.add-member:active .plus{transform:scale(.88) rotate(90deg);}

/* 右键菜单 */
.ctx-mask{position:absolute;inset:0;z-index:200;display:none;}
.ctx-mask.show{display:block;}
.ctx-menu{position:absolute;background:rgba(60,40,28,.97);backdrop-filter:blur(10px);border-radius:15px;padding:6px;min-width:168px;box-shadow:0 18px 44px rgba(0,0,0,.4);animation:ctxin .15s ease;transform-origin:top left;}
@keyframes ctxin{from{opacity:0;transform:scale(.85);}to{opacity:1;transform:scale(1);}}
.ctx-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:10px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;transition:.12s;}
.ctx-item:hover{background:rgba(255,255,255,.15);}
.ctx-item.danger{color:#ff9a9a;}
.ctx-item .ci{font-size:16px;width:20px;text-align:center;}
.ctx-item+.ctx-item{border-top:1px solid rgba(255,255,255,.07);}

/* 弹窗 / Toast */
.modal-mask{position:absolute;inset:0;background:rgba(60,35,15,.5);z-index:150;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .22s;}
.modal-mask.show{opacity:1;pointer-events:auto;}
.modal{width:380px;max-width:90%;background:var(--panel);border-radius:26px;padding:22px;box-shadow:var(--shadow-panel);transform:scale(.9);transition:transform .25s cubic-bezier(.3,1.3,.5,1);max-height:82%;display:flex;flex-direction:column;}
.modal-mask.show .modal{transform:scale(1);}
.modal h3{text-align:center;font-size:19px;font-weight:900;margin-bottom:4px;}
.modal .m-sub{text-align:center;font-size:13px;color:var(--ink-soft);margin-bottom:16px;}
.modal-body{overflow-y:auto;}
.modal-foot{display:flex;gap:10px;margin-top:16px;}
.modal-foot .pill{flex:1;}
.menu-row{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;font-size:15px;font-weight:800;cursor:pointer;transition:.12s;}
.menu-row:hover{background:var(--cream);}
.menu-row .mi{font-size:21px;}
.menu-row.danger{color:var(--pink);}
.invite-row{display:flex;align-items:center;gap:12px;padding:9px 8px;border-radius:14px;cursor:pointer;}
.invite-row:hover{background:var(--cream);}
.invite-row .nm{flex:1;font-size:15px;font-weight:800;}
.pick{width:24px;height:24px;border-radius:50%;border:2px solid #e3c4ac;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;transition:.15s;flex-shrink:0;}
.pick.on{background:var(--green);border-color:var(--green);}
.modal textarea,.modal .m-input{width:100%;background:var(--cream);border:none;border-radius:14px;padding:12px 14px;font-size:15px;color:var(--ink);outline:none;resize:none;font-family:inherit;box-shadow:inset 0 2px 6px rgba(160,100,60,.12);}
.modal textarea{min-height:90px;line-height:1.5;}
/* 资料卡字段 */
.pf-fields{margin-top:14px;}
.pf-fields label{display:block;font-size:12px;font-weight:800;color:var(--ink-soft);margin:12px 2px 5px;}
.pf-val{background:var(--cream);border-radius:14px;padding:12px 14px;font-size:15px;font-weight:700;}
.search-res{display:flex;align-items:center;gap:12px;padding:12px;background:var(--cream);border-radius:16px;margin-top:6px;}
.search-res .nm{flex:1;}
.search-res .nm .n{font-weight:800;font-size:15px;}
.search-res .nm .z{font-size:12px;color:var(--ink-soft);}
.histitem{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:14px;cursor:pointer;}
.histitem:hover{background:var(--cream);}
.histitem .hh{display:flex;justify-content:space-between;}
.histitem .who{font-weight:800;font-size:13px;}
.histitem .when{font-size:11px;color:var(--ink-soft);}
.histitem .txt{font-size:13px;color:var(--ink-soft);}
.toast{position:absolute;left:50%;top:70px;transform:translateX(-50%) translateY(-20px);background:rgba(60,40,28,.95);color:#fff;padding:12px 24px;border-radius:16px;font-size:14px;font-weight:800;z-index:300;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.hidden{display:none!important;}
</style>
</head>
<body>
<div class="window">
  <div class="titlebar">
    <div class="tb-dots"><i class="r"></i><i class="y"></i><i class="g"></i></div>
    <div class="tb-logo">zoo</div>
    <div class="tb-spacer"></div>
    <div class="tb-win"><span title="最小化">—</span><span title="最大化">▢</span><span title="关闭" onclick="toast('（原型）关闭窗口')">✕</span></div>
  </div>

  <div class="stage">
    <!-- ====== 登录 ====== -->
    <div id="login">
      <div class="blob b1"></div><div class="blob b2"></div>
      <div class="login-hero">
        <div class="zoo-plaque"><div class="w"><b>z</b><b>o</b><b>o</b></div></div>
        <div class="zoo-sub">P A R T Y &nbsp; C H A T</div>
        <div class="parade" id="parade"></div>
      </div>
      <div class="login-card">
        <h2>欢迎回到派对 🎉</h2>
        <div class="lc-sub">登录后和伙伴们一起开黑</div>
        <div class="field"><span>📧</span><input value="party@zoo.fun"></div>
        <div class="field"><span>🔒</span><input type="password" value="123456"></div>
        <div class="row-opts">
          <div class="chk on" onclick="this.classList.toggle('on')"><i></i>记住我 30 天</div>
          <a href="javascript:void(0)" onclick="toast('已发送找回邮件 ✉️')">忘记密码?</a>
        </div>
        <button class="pill green" onclick="doLogin()">▶ 进入派对</button>
        <div class="signup">还没有账号? <a href="javascript:void(0)" onclick="toast('跳转注册页…')">立即加入</a></div>
      </div>
    </div>

    <!-- ====== 主应用 ====== -->
    <div id="app">
      <div class="app-main">
        <!-- 导航 -->
        <div class="nav-rail">
          <div class="me-av" id="navMeAv" onclick="openProfile(ME,true)"></div>
          <div class="me-name">橘座</div>
          <div class="nav-ic on" data-tab="msg" onclick="switchTab('msg')" title="消息">💬<span class="pip show" id="navPip">3</span></div>
          <div class="nav-ic" data-tab="contacts" onclick="switchTab('contacts')" title="联系人">👥</div>
          <div class="nav-grow"></div>
          <div class="nav-ic" onclick="openModal('settingsModal')" title="设置">⚙️</div>
        </div>

        <!-- 列表 -->
        <div class="col-list">
          <div class="tab-pane" id="pane-msg" style="display:flex;flex-direction:column;flex:1;min-height:0;">
            <div class="list-head"><h2>消息</h2><button class="head-add" onclick="openModal('addModal')">＋</button></div>
            <div class="search"><span>🔍</span><input placeholder="搜索好友 / 群聊" oninput="filterChats(this.value)"></div>
            <div class="list-scroll" id="chatList"></div>
          </div>
          <div class="tab-pane hidden" id="pane-contacts" style="flex-direction:column;flex:1;min-height:0;">
            <div class="list-head"><h2>联系人</h2><button class="head-add" onclick="openModal('addModal')">＋</button></div>
            <div class="search"><span>🔍</span><input placeholder="搜索联系人" oninput="filterContacts(this.value)"></div>
            <div class="list-scroll" id="contactList"></div>
          </div>
        </div>

        <!-- 主聊天 -->
        <div class="col-chat">
          <div class="chat-empty" id="chatEmpty">
            <div class="big">🐾</div>
            <div style="font-weight:800;font-size:16px;">选择一个聊天开始派对</div>
            <div style="font-size:13px;">左侧挑个好友或群聊吧~</div>
          </div>
          <div class="chat-room hidden" id="chatRoom">
            <div class="chat-head">
              <div id="headAv"></div>
              <div class="ct"><div class="t" id="chatTitle"></div><div class="s" id="chatSub"></div></div>
              <button class="icon-btn" onclick="openSearch()" title="查找聊天记录">🔍</button>
              <button class="icon-btn" id="moreBtn" onclick="toggleInfo()" title="更多">⋯</button>
            </div>
            <div class="msgs" id="msgs"></div>
            <div class="input-area">
              <div class="toolbar">
                <button class="tool-ic" onclick="toggleEmoji(event)" title="表情">😀</button>
                <button class="tool-ic" onclick="sendImage()" title="图片">🖼️</button>
                <button class="tool-ic" onclick="sendFile()" title="文件">📁</button>
                <button class="tool-ic" onclick="toast('截图')" title="截图">✂️</button>
              </div>
              <div class="input-row">
                <div class="input-box"><textarea id="msgInput" rows="1" placeholder="说点什么…  (Enter 发送 / Shift+Enter 换行)" onkeydown="msgKey(event)" oninput="autoGrow(this)"></textarea></div>
                <button class="pill green send-pill" onclick="sendText()">发送</button>
              </div>
            </div>
            <div class="emoji-pop" id="emojiPop"><div class="emoji-grid" id="emojiGrid"></div></div>
          </div>
        </div>

        <!-- 右侧折叠信息面板 -->
        <div class="col-info" id="colInfo"><div class="info-inner" id="infoInner"></div></div>
      </div>
    </div>
  </div>

  <!-- 右键菜单 -->
  <div class="ctx-mask" id="ctxMask" onclick="closeCtx()">
    <div class="ctx-menu" id="ctxMenu">
      <div class="ctx-item" onclick="ctxAction('time')"><span class="ci">🕒</span>显示时间</div>
      <div class="ctx-item" onclick="ctxAction('copy')"><span class="ci">📋</span>复制</div>
      <div class="ctx-item" id="ctxRecall" onclick="ctxAction('recall')"><span class="ci">↩️</span>撤回</div>
      <div class="ctx-item danger" onclick="ctxAction('delete')"><span class="ci">🗑️</span>删除</div>
    </div>
  </div>

  <!-- 添加 -->
  <div class="modal-mask" id="addModal" onclick="if(event.target===this)closeModal('addModal')">
    <div class="modal">
      <h3>添加</h3>
      <div class="modal-body">
        <div class="menu-row" onclick="closeModal('addModal');openModal('addFriendModal')"><span class="mi">🙋</span>加好友 / 群</div>
        <div class="menu-row" onclick="closeModal('addModal');openCreateGroup()"><span class="mi">👥</span>创建群聊</div>
      </div>
    </div>
  </div>

  <!-- 加好友 -->
  <div class="modal-mask" id="addFriendModal" onclick="if(event.target===this)closeModal('addFriendModal')">
    <div class="modal">
      <h3>加好友 / 群</h3>
      <div class="m-sub">输入 zoo 号或昵称搜索</div>
      <div class="modal-body">
        <div class="field" style="margin-bottom:6px"><span>🔍</span><input id="afInput" placeholder="zoo 号 / 昵称" oninput="searchStranger(this.value)"></div>
        <div id="afResult"></div>
      </div>
    </div>
  </div>

  <!-- 创建群聊 -->
  <div class="modal-mask" id="createGroupModal" onclick="if(event.target===this)closeModal('createGroupModal')">
    <div class="modal">
      <h3>创建群聊</h3>
      <div class="m-sub">取个名字，拉上伙伴一起开黑</div>
      <div class="modal-body">
        <div class="field" style="margin-bottom:12px"><span>👥</span><input id="cgName" placeholder="群聊名称（如：周末派对车队）"></div>
        <div style="font-size:12px;font-weight:800;color:var(--ink-soft);margin:0 2px 6px;">选择成员</div>
        <div id="cgList"></div>
      </div>
      <div class="modal-foot">
        <button class="pill cream" onclick="closeModal('createGroupModal')">取消</button>
        <button class="pill green" onclick="confirmCreateGroup()">创建 <span id="cgCount">0</span> 人群</button>
      </div>
    </div>
  </div>

  <!-- 邀请进群 -->
  <div class="modal-mask" id="inviteModal" onclick="if(event.target===this)closeModal('inviteModal')">
    <div class="modal">
      <h3>邀请好友加入</h3>
      <div class="m-sub" id="inviteSub">选择伙伴拉进群聊</div>
      <div class="modal-body" id="inviteList"></div>
      <div class="modal-foot">
        <button class="pill cream" onclick="closeModal('inviteModal')">取消</button>
        <button class="pill green" onclick="confirmInvite()">邀请 <span id="invCount">0</span> 位</button>
      </div>
    </div>
  </div>

  <!-- 查找聊天记录 -->
  <div class="modal-mask" id="searchModal" onclick="if(event.target===this)closeModal('searchModal')">
    <div class="modal">
      <h3>查找聊天记录</h3>
      <div class="modal-body">
        <div class="field" style="margin-bottom:8px"><span>🔍</span><input id="searchInput" placeholder="输入关键词" oninput="renderSearch(this.value)"></div>
        <div id="searchResults"></div>
      </div>
    </div>
  </div>

  <!-- 资料卡 -->
  <div class="modal-mask" id="profileModal" onclick="if(event.target===this)closeModal('profileModal')">
    <div class="modal" id="profileBox"></div>
  </div>

  <!-- 头像更换 -->
  <div class="modal-mask" id="avatarModal" onclick="if(event.target===this)closeModal('avatarModal')">
    <div class="modal">
      <h3>更换 3D 形象</h3>
      <div class="m-sub">挑一个你喜欢的角色</div>
      <div class="modal-body"><div class="members" id="avatarChoices"></div></div>
    </div>
  </div>

  <!-- 设置(只保留退出登录) -->
  <div class="modal-mask" id="settingsModal" onclick="if(event.target===this)closeModal('settingsModal')">
    <div class="modal">
      <h3>设置</h3>
      <div class="modal-body"><div class="menu-row danger" onclick="logout()"><span class="mi">🚪</span>退出登录</div></div>
    </div>
  </div>

  <!-- 通用输入 -->
  <div class="modal-mask" id="promptModal" onclick="if(event.target===this)closeModal('promptModal')">
    <div class="modal">
      <h3 id="promptTitle">标题</h3>
      <div class="modal-body"><textarea id="promptText" rows="3"></textarea></div>
      <div class="modal-foot">
        <button class="pill cream" onclick="closeModal('promptModal')">取消</button>
        <button class="pill green" onclick="confirmPrompt()">保存</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
/* ========================= 3D 头像资源 ========================= */
const A3D='https://cdn.jsdelivr.net/gh/microsoft/fluentui-emoji@main/assets/';
function img3d(folder,base){return A3D+encodeURIComponent(folder)+'/3D/'+base+'_3d.png';}
const FACE={
  cat:img3d('Cat face','cat_face'), dog:img3d('Dog face','dog_face'),
  wolf:img3d('Wolf','wolf'), croc:img3d('Crocodile','crocodile'),
  bear:img3d('Bear','bear'), bunny:img3d('Rabbit face','rabbit_face'),
  pig:img3d('Pig face','pig_face'), tiger:img3d('Tiger face','tiger_face'),
  fox:img3d('Fox','fox'),
};

/* ========================= 数据 ========================= */
const ME={id:'me',name:'橘座大魔王',emoji:'🐱',color:'c-cat',img:FACE.cat,zoo:'88_meow',birth:'2001-03-15'};
const friends=[
  {id:'dog',  name:'柯基队长',emoji:'🐶',color:'c-dog',  img:FACE.dog,  online:true, zoo:'corgi_01', birth:'1999-08-08'},
  {id:'wolf', name:'哈士奇',  emoji:'🐺',color:'c-wolf', img:FACE.wolf, online:true, zoo:'husky_wooo',birth:'2000-12-01'},
  {id:'croc', name:'鳄鱼老六',emoji:'🐊',color:'c-croc', img:FACE.croc, online:false,zoo:'croc_666',  birth:'1998-05-20'},
  {id:'bear', name:'熊大',    emoji:'🐻',color:'c-bear', img:FACE.bear, online:true, zoo:'bigbear',    birth:'1997-02-14'},
  {id:'bunny',name:'兔兔',    emoji:'🐰',color:'c-bunny',img:FACE.bunny,online:false,zoo:'bunbun',     birth:'2002-04-04'},
  {id:'pig',  name:'猪猪侠',  emoji:'🐷',color:'c-pig',  img:FACE.pig,  online:true, zoo:'pighero',    birth:'2001-10-10'},
  {id:'tiger',name:'泰哥',    emoji:'🐯',color:'c-tiger',img:FACE.tiger,online:true, zoo:'tiger_bro',  birth:'1996-06-06'},
];
const strangers=[
  {id:'fox', name:'狐狸尼克',emoji:'🦊',color:'c-fox', img:FACE.fox,  online:true, zoo:'nick_fox', birth:'2000-01-01'},
];
const chats=[
  {id:'g1',type:'group',name:'柯基小队',emoji:'🐶',color:'c-dog',img:FACE.dog,sub:'3 位成员 · 2 在线',time:'11:30',preview:'柯基队长: 晚上一起开黑吗？',unread:3,members:['dog','wolf','croc'],pinned:true},
  {id:'c1',type:'single',name:'哈士奇',emoji:'🐺',color:'c-wolf',img:FACE.wolf,sub:'在线',time:'昨天',preview:'[图片] 快看这个！',unread:0,friendId:'wolf'},
  {id:'g2',type:'group',name:'喵星人交流群',emoji:'🐱',color:'c-cat',img:FACE.cat,sub:'12 位成员',time:'星期二',preview:'管理员更新了群公告',unread:0,members:['dog','wolf','bear','bunny','tiger']},
  {id:'c2',type:'single',name:'熊大',emoji:'🐻',color:'c-bear',img:FACE.bear,sub:'在线',time:'星期一',preview:'明天的派对别迟到~',unread:0,friendId:'bear'},
];
function ts(h,m,s){const d=new Date();d.setHours(h,m,s,0);return d;}
const conversations={
  g1:[
    {id:1,from:'dog', type:'text',text:'晚上一起开黑吗？我建好房间了！🎮',time:ts(20,12,8)},
    {id:2,from:'me',  type:'text',text:'没问题！今晚我选鳄鱼，看我把你们全扔下飞艇 😎',time:ts(20,12,40)},
    {id:3,from:'wolf',type:'file',text:'zoo高分技巧.pdf',size:'2.4 MB',time:ts(20,13,2)},
    {id:4,from:'croc',type:'text',text:'我刚上线，房号多少？',time:ts(20,13,55)},
  ],
  c1:[
    {id:1,from:'wolf',type:'text',text:'在吗？',time:ts(14,2,10)},
    {id:2,from:'wolf',type:'image',time:ts(14,2,20)},
    {id:3,from:'me',  type:'text',text:'哈哈哈这表情绝了',time:ts(14,5,1)},
  ],
  g2:[
    {id:1,from:'bear',type:'text',text:'新群公告大家看一下~',time:ts(9,30,0)},
    {id:2,from:'me',  type:'text',text:'收到 👌',time:ts(9,31,12)},
  ],
  c2:[
    {id:1,from:'bear',type:'text',text:'明天的派对别迟到~',time:ts(18,40,5)},
    {id:2,from:'me',  type:'text',text:'放心 准时到 🎉',time:ts(18,41,30)},
  ],
};
const groupNotice={g1:'欢迎大家来到 zoo 开黑群！每晚 8 点准时发车，严禁使用外挂，开心最重要~ 🐾',g2:'喵星人交流群公告：理性吸猫，文明发言~ 🐱'};
const EMOJIS=['😀','😂','🥰','😎','🤩','😭','😡','👍','🙏','🎉','🔥','💯','🐶','🐱','🐺','🐊','🐻','🐰','🐷','🐯','🦊','🦁','🐮','🐸','🍻','🎮','💥','✨','❤️','💔','🤝','👀','🥳','😴','🤔','😤','🙈','💪'];

let currentChat=null, ctxTarget=null;
function userById(id){return id==='me'?ME:(friends.find(f=>f.id===id)||strangers.find(s=>s.id===id)||{name:'神秘伙伴',emoji:'❓',color:'c-cat',img:FACE.cat});}
function avHTML(u,size,sq){
  return `<div class="av av-${size} ${u.color}${sq?' av-sq':''}">
    <img src="${u.img||''}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='inline-block'">
    <span class="fb" style="display:none">${u.emoji||'❓'}</span></div>`;
}

/* ========================= 登录 ========================= */
function doLogin(){
  const lg=document.getElementById('login');lg.style.opacity='0';
  setTimeout(()=>{lg.classList.add('hidden');
    const a=document.getElementById('app');a.style.display='flex';a.style.opacity='0';a.style.transition='opacity .4s';
    void a.offsetWidth;a.style.opacity='1';},500);
}
function logout(){location.reload();}

/* ========================= Tab ========================= */
function switchTab(tab){
  document.querySelectorAll('.nav-ic[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  const m=document.getElementById('pane-msg'),c=document.getElementById('pane-contacts');
  m.classList.toggle('hidden',tab!=='msg');c.classList.toggle('hidden',tab!=='contacts');
  m.style.display=tab==='msg'?'flex':'none';c.style.display=tab==='contacts'?'flex':'none';
}

/* ========================= 列表 ========================= */
function renderChatList(filter=''){
  const box=document.getElementById('chatList');box.innerHTML='';
  const sorted=chats.slice().sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0));
  sorted.filter(c=>c.name.includes(filter)).forEach(c=>{
    const el=document.createElement('div');el.className='chat-item'+(c.id===currentChat?' on':'');el.onclick=()=>openChat(c.id);
    el.innerHTML=`${avHTML(c,'lg')}
      <div class="ci-mid"><div class="ci-top"><span class="ci-name">${c.pinned?'📌':''}${c.name}</span><span class="ci-time">${c.time}</span></div>
      <div class="ci-prev">${c.preview}</div></div>${c.unread?`<div class="badge">${c.unread}</div>`:''}`;
    box.appendChild(el);
  });
}
function filterChats(v){renderChatList(v.trim());}
function renderContacts(filter=''){
  const box=document.getElementById('contactList');
  const list=friends.filter(f=>f.name.includes(filter));
  box.innerHTML='<div class="grp-label">我的伙伴 ('+friends.length+')</div>';
  list.forEach(f=>{const el=document.createElement('div');el.className='contact';el.onclick=()=>openProfile(f,false);
    el.innerHTML=`${avHTML(f,'md')}<div><div class="nm">${f.name}</div><div class="st">${f.online?'在线':'离线'}</div></div>
      <div class="signal ${f.online?'on':''}"><i></i><i></i><i></i></div>`;box.appendChild(el);});
}
function filterContacts(v){renderContacts(v.trim());}

function openSingleChatByFriend(f){
  let c=chats.find(x=>x.type==='single'&&x.friendId===f.id);
  if(!c){c={id:'c_'+f.id,type:'single',name:f.name,emoji:f.emoji,color:f.color,img:f.img,sub:f.online?'在线':'离线',time:'刚刚',preview:'',unread:0,friendId:f.id};chats.push(c);conversations[c.id]=[];}
  switchTab('msg');openChat(c.id);
}

/* ========================= 会话 ========================= */
function openChat(id){
  currentChat=id;const c=chats.find(x=>x.id===id);if(!c)return;
  document.getElementById('chatEmpty').classList.add('hidden');
  document.getElementById('chatRoom').classList.remove('hidden');
  document.getElementById('chatTitle').textContent=c.name;
  document.getElementById('chatSub').textContent=c.sub;
  document.getElementById('headAv').innerHTML=avHTML(c,'md');
  c.unread=0;renderChatList();updatePip();renderMessages();closeInfo();closeEmoji();
}
function renderMessages(){
  const box=document.getElementById('msgs');const list=conversations[currentChat]||[];const c=chats.find(x=>x.id===currentChat);
  box.innerHTML='';let lastSep=null;
  list.forEach(m=>{const sep=fmtTime(m.time,'hm');
    if(sep!==lastSep){const s=document.createElement('div');s.className='time-sep';s.textContent=sep;box.appendChild(s);lastSep=sep;}
    box.appendChild(buildMsg(m,c));});
  setTimeout(()=>box.scrollTop=box.scrollHeight,20);
}
function buildMsg(m,c){
  if(m.recalled){const r=document.createElement('div');r.className='recalled';
    r.textContent=(m.from==='me'?'你':userById(m.from).name)+' 撤回了一条消息';return r;}
  const u=userById(m.from),me=m.from==='me';
  const row=document.createElement('div');row.className='msg '+(me?'me':'them');row.dataset.id=m.id;
  let inner='';
  if(m.type==='text')inner=esc(m.text);
  else if(m.type==='file')inner=`<div class="fic">📄</div><div><div style="font-weight:800">${esc(m.text)}</div><div style="font-size:11px;opacity:.7;margin-top:2px">${m.size||''}</div></div>`;
  else if(m.type==='image')inner=`<div class="ph">🖼️</div>`;
  const bc='bubble'+(m.type==='file'?' file-b':'')+(m.type==='image'?' img-b':'');
  const showName=(c.type==='group'&&!me);
  row.innerHTML=`${avHTML(u,'sm')}<div class="bubble-wrap">
    ${showName?`<div class="sender">${u.name}</div>`:''}
    <div class="${bc}">${inner}<div class="tsec">🕒 ${fmtTime(m.time,'full')}</div></div></div>`;
  bindCtx(row.querySelector('.bubble'),m,row);
  return row;
}

/* ========================= 发送 ========================= */
function pushMsg(msg){
  if(!conversations[currentChat])conversations[currentChat]=[];
  msg.id=Date.now();msg.time=new Date();conversations[currentChat].push(msg);renderMessages();
  const c=chats.find(x=>x.id===currentChat);if(c){c.preview=previewOf(msg);c.time='刚刚';renderChatList();}
}
function previewOf(m){if(m.type==='text')return (m.from==='me'?'':userById(m.from).name+': ')+m.text;
  if(m.type==='file')return '[文件] '+m.text;if(m.type==='image')return '[图片]';return '';}
function sendText(){const inp=document.getElementById('msgInput');const v=inp.value.replace(/\s+$/,'');if(!v.trim())return;
  pushMsg({from:'me',type:'text',text:v});inp.value='';autoGrow(inp);closeEmoji();maybeReply();}
function sendImage(){if(!currentChat)return;pushMsg({from:'me',type:'image'});maybeReply();}
function sendFile(){if(!currentChat)return;pushMsg({from:'me',type:'file',text:'我的派对录像.mp4',size:'18.6 MB'});}
function msgKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendText();}}
function autoGrow(t){t.style.height='auto';t.style.height=Math.min(t.scrollHeight,132)+'px';}
function maybeReply(){const c=chats.find(x=>x.id===currentChat);if(!c)return;
  const fromId=c.type==='group'?(c.members?c.members[0]:'dog'):(c.friendId||'dog');
  const lines=['收到收到 🎉','哈哈哈哈','这就来！','稳了 😎','+1','晚点见~','好嘞 👌'];
  setTimeout(()=>{if(currentChat===c.id)pushMsg({from:fromId,type:'text',text:lines[Math.floor(Math.random()*lines.length)]});},1100);}

/* 表情 */
function buildEmoji(){const g=document.getElementById('emojiGrid');g.innerHTML='';
  EMOJIS.forEach(e=>{const b=document.createElement('button');b.textContent=e;
    b.onclick=()=>{const i=document.getElementById('msgInput');i.value+=e;i.focus();autoGrow(i);};g.appendChild(b);});}
function toggleEmoji(ev){ev&&ev.stopPropagation();document.getElementById('emojiPop').classList.toggle('show');}
function closeEmoji(){document.getElementById('emojiPop').classList.remove('show');}

/* ========================= 右键菜单 ========================= */
function bindCtx(el,m,row){
  el.addEventListener('contextmenu',e=>{e.preventDefault();showCtx(e.clientX,e.clientY,m,row);});
  let timer=null;
  el.addEventListener('touchstart',e=>{timer=setTimeout(()=>{const t=e.touches[0];showCtx(t.clientX,t.clientY,m,row);},480);},{passive:true});
  ['touchend','touchmove','touchcancel'].forEach(ev=>el.addEventListener(ev,()=>clearTimeout(timer)));
}
function showCtx(x,y,m,row){
  ctxTarget={m,row};
  document.getElementById('ctxRecall').style.display=(m.from==='me'?'flex':'none');
  const mask=document.getElementById('ctxMask'),menu=document.getElementById('ctxMenu');mask.classList.add('show');
  const w=document.querySelector('.window').getBoundingClientRect();const mw=170,mh=190;
  let px=Math.min(x-w.left,w.width-mw-10),py=Math.min(y-w.top,w.height-mh-10);
  menu.style.left=Math.max(8,px)+'px';menu.style.top=Math.max(8,py)+'px';
}
function closeCtx(){document.getElementById('ctxMask').classList.remove('show');}
function ctxAction(act){if(!ctxTarget){closeCtx();return;}const {m,row}=ctxTarget;
  if(act==='time'){const b=row.querySelector('.bubble');b&&b.classList.toggle('show-time');}
  else if(act==='copy'){navigator.clipboard&&navigator.clipboard.writeText(m.text||'[非文本消息]');toast('已复制 📋');}
  else if(act==='recall'){m.recalled=true;renderMessages();toast('已撤回 ↩️');}
  else if(act==='delete'){const arr=conversations[currentChat];const i=arr.findIndex(x=>x.id===m.id);if(i>-1)arr.splice(i,1);renderMessages();toast('已删除 🗑️');}
  closeCtx();}

/* ========================= 折叠信息面板 ========================= */
function toggleInfo(){const panel=document.getElementById('colInfo');
  if(panel.classList.contains('open')){closeInfo();}else{renderInfo();panel.classList.add('open');}}
function closeInfo(){document.getElementById('colInfo').classList.remove('open');}
function renderInfo(){
  const c=chats.find(x=>x.id===currentChat);if(!c)return;
  const inner=document.getElementById('infoInner');
  if(c.type==='group'){
    const ids=c.members||[];
    let mem='';
    ids.forEach((id,i)=>{const u=userById(id);
      mem+=`<div class="member" onclick="openProfile(userById('${id}'),false)">${i===0?'<span class="owner-tag">群主</span>':''}${avHTML(u,'md')}<span class="mn">${u.name}</span></div>`;});
    mem+=`<div class="member add-member" onclick="openInvite()"><div class="plus">＋</div><span class="mn">邀请</span></div>`;
    inner.innerHTML=`
      <div class="info-head"><b>群聊信息</b><button class="icon-btn" onclick="closeInfo()">✕</button></div>
      <div class="info-body">
        <div class="gi-hero">${avHTML(c,'xl')}<div class="nm">${c.name}</div>
          <div class="gi-remark" onclick="promptInput('设置群备注','给这个群起个名字…','',()=>toast('备注已保存 ✏️'))">✏️ 添加备注</div></div>
        <div class="gi-sec"><div class="h"><b>群公告</b><span class="e" onclick="editNotice()">✏️</span></div>
          <div class="notice-text" id="noticeText">${esc(groupNotice[c.id]||'暂无群公告')}</div></div>
        <div class="gi-sec"><div class="h"><b>群成员 (${ids.length})</b><span class="e" onclick="toast('查看全部成员')">›</span></div>
          <div class="members">${mem}</div></div>
        <div class="gi-sec" style="padding:6px 10px">
          <div class="gi-line" onclick="togglePin()"><span class="gi-ic">📌</span>${c.pinned?'取消置顶':'置顶聊天'}<span class="gi-arr">${c.pinned?'已置顶':''}</span></div>
          <div class="gi-line" onclick="toast('消息免打扰已开启 🔕')"><span class="gi-ic">🔕</span>消息免打扰<span class="gi-arr">›</span></div>
          <div class="gi-line" onclick="clearChat()"><span class="gi-ic">🧹</span>清空聊天记录<span class="gi-arr">›</span></div>
          <div class="gi-line danger" onclick="leaveGroup()"><span class="gi-ic">🚪</span>退出群聊</div>
        </div></div>`;
  }else{
    const f=userById(c.friendId);
    inner.innerHTML=`
      <div class="info-head"><b>聊天信息</b><button class="icon-btn" onclick="closeInfo()">✕</button></div>
      <div class="info-body">
        <div class="gi-hero">${avHTML(f,'xl')}<div class="nm">${f.name}</div>
          <div class="gi-remark" onclick="setRemark('${c.id}')">✏️ ${c.remark?('备注: '+esc(c.remark)):'添加备注'}</div></div>
        <div class="gi-sec" style="padding:6px 10px">
          <div class="gi-line" onclick="openProfile(userById('${c.friendId}'),false)"><span class="gi-ic">🪪</span>查看资料<span class="gi-arr">›</span></div>
          <div class="gi-line" onclick="setRemark('${c.id}')"><span class="gi-ic">✏️</span>设置备注<span class="gi-arr">›</span></div>
          <div class="gi-line" onclick="togglePin()"><span class="gi-ic">📌</span>${c.pinned?'取消置顶':'置顶聊天'}<span class="gi-arr">${c.pinned?'已置顶':''}</span></div>
          <div class="gi-line" onclick="toast('消息免打扰已开启 🔕')"><span class="gi-ic">🔕</span>消息免打扰<span class="gi-arr">›</span></div>
        </div>
        <div class="gi-sec" style="padding:6px 10px">
          <div class="gi-line danger" onclick="blockFriend('${c.friendId}')"><span class="gi-ic">🚫</span>加入黑名单</div>
          <div class="gi-line danger" onclick="deleteFriend('${c.friendId}')"><span class="gi-ic">🗑️</span>删除好友</div>
        </div></div>`;
  }
}
function togglePin(){const c=chats.find(x=>x.id===currentChat);c.pinned=!c.pinned;renderChatList();renderInfo();toast(c.pinned?'已置顶 📌':'已取消置顶');}
function setRemark(id){const c=chats.find(x=>x.id===id);
  promptInput('设置备注','给这位好友起个备注…',c.remark||'',v=>{c.remark=v;renderInfo();toast('备注已保存 ✏️');});}
function editNotice(){const c=chats.find(x=>x.id===currentChat);
  promptInput('编辑群公告','输入群公告内容…',groupNotice[c.id]||'',v=>{if(v)groupNotice[c.id]=v;renderInfo();toast('群公告已更新 📢');});}
function clearChat(){conversations[currentChat]=[];renderMessages();toast('聊天记录已清空 🧹');}
function leaveGroup(){const id=currentChat;closeInfo();backToEmpty();const i=chats.findIndex(x=>x.id===id);if(i>-1)chats.splice(i,1);renderChatList();toast('已退出群聊');}
function blockFriend(fid){const id=currentChat;closeInfo();backToEmpty();
  const i=chats.findIndex(x=>x.id===id);if(i>-1)chats.splice(i,1);
  const fi=friends.findIndex(f=>f.id===fid);if(fi>-1)friends.splice(fi,1);
  renderChatList();renderContacts();toast('已加入黑名单 🚫');}
function deleteFriend(fid){const id=currentChat;closeInfo();backToEmpty();
  const i=chats.findIndex(x=>x.id===id);if(i>-1)chats.splice(i,1);
  const fi=friends.findIndex(f=>f.id===fid);if(fi>-1)friends.splice(fi,1);
  renderChatList();renderContacts();toast('已删除好友 🗑️');}
function backToEmpty(){currentChat=null;document.getElementById('chatRoom').classList.add('hidden');document.getElementById('chatEmpty').classList.remove('hidden');}

/* ========================= 邀请进群 ========================= */
let inviteSel=new Set();
function openInvite(){inviteSel.clear();const c=chats.find(x=>x.id===currentChat);const inG=new Set(c.members||[]);
  document.getElementById('inviteSub').textContent='选择伙伴拉进「'+c.name+'」';
  const box=document.getElementById('inviteList');box.innerHTML='';
  const avail=friends.filter(f=>!inG.has(f.id));
  avail.forEach(f=>{const el=document.createElement('div');el.className='invite-row';
    el.onclick=()=>{inviteSel.has(f.id)?inviteSel.delete(f.id):inviteSel.add(f.id);el.querySelector('.pick').classList.toggle('on');document.getElementById('invCount').textContent=inviteSel.size;};
    el.innerHTML=`${avHTML(f,'md')}<span class="nm">${f.name}</span><div class="pick">✓</div>`;box.appendChild(el);});
  if(!avail.length)box.innerHTML='<div style="text-align:center;color:var(--ink-soft);padding:24px">好友都已在群里啦 🎉</div>';
  document.getElementById('invCount').textContent=0;openModal('inviteModal');}
function confirmInvite(){if(!inviteSel.size){toast('先选择伙伴吧~');return;}
  const c=chats.find(x=>x.id===currentChat);c.members=[...(c.members||[]),...inviteSel];c.sub=c.members.length+' 位成员';
  document.getElementById('chatSub').textContent=c.sub;renderInfo();closeModal('inviteModal');toast('已邀请 '+inviteSel.size+' 位伙伴 🎉');}

/* ========================= 加好友 ========================= */
function searchStranger(v){const box=document.getElementById('afResult');v=v.trim();
  if(!v){box.innerHTML='';return;}
  const pool=[...strangers,...friends];
  const hit=pool.find(p=>p.name.includes(v)||(p.zoo&&p.zoo.includes(v)))||strangers[0];
  const already=friends.some(f=>f.id===hit.id);
  box.innerHTML=`<div class="search-res">${avHTML(hit,'md')}
    <div class="nm"><div class="n">${hit.name}</div><div class="z">zoo 号: ${hit.zoo}</div></div>
    ${already?'<span style="color:var(--ink-soft);font-weight:800;font-size:13px">已是好友</span>'
      :`<button class="pill green" style="padding:8px 16px" onclick="addNewFriend('${hit.id}')">添加</button>`}</div>`;}
function addNewFriend(id){let u=strangers.find(s=>s.id===id);
  if(u){strangers.splice(strangers.indexOf(u),1);}else{u=userById(id);}
  if(!friends.some(f=>f.id===id)){friends.push({...u,online:true});}
  renderContacts();closeModal('addFriendModal');document.getElementById('afInput').value='';document.getElementById('afResult').innerHTML='';
  toast('已添加好友 '+u.name+' 🎉');}

/* ========================= 创建群聊 ========================= */
let cgSel=new Set();
function openCreateGroup(){cgSel.clear();document.getElementById('cgName').value='';document.getElementById('cgCount').textContent=0;
  const box=document.getElementById('cgList');box.innerHTML='';
  friends.forEach(f=>{const el=document.createElement('div');el.className='invite-row';
    el.onclick=()=>{cgSel.has(f.id)?cgSel.delete(f.id):cgSel.add(f.id);el.querySelector('.pick').classList.toggle('on');document.getElementById('cgCount').textContent=cgSel.size+1;};
    el.innerHTML=`${avHTML(f,'md')}<span class="nm">${f.name}</span><div class="pick">✓</div>`;box.appendChild(el);});
  openModal('createGroupModal');}
function confirmCreateGroup(){
  if(cgSel.size<1){toast('至少选择 1 位伙伴~');return;}
  let name=document.getElementById('cgName').value.trim();
  const ids=[...cgSel];if(!name)name=ids.map(i=>userById(i).name).slice(0,3).join('、')+'…';
  const id='g_'+Date.now();
  chats.unshift({id,type:'group',name,emoji:'🎉',color:'c-cat',img:FACE.cat,sub:(ids.length+1)+' 位成员',time:'刚刚',preview:'群聊已创建',unread:0,members:[...ids]});
  groupNotice[id]='欢迎来到「'+name+'」，一起开黑吧！🐾';conversations[id]=[];
  closeModal('createGroupModal');switchTab('msg');openChat(id);toast('群聊已创建 🎉');}

/* ========================= 资料卡 ========================= */
let profileUser=null;
function openProfile(u,editable){profileUser=u;
  const isMe=u.id==='me';editable=editable&&isMe;
  const box=document.getElementById('profileBox');
  box.innerHTML=`
    <h3>${isMe?'我的资料':'个人资料'}</h3>
    <div class="modal-body">
      <div style="display:flex;flex-direction:column;align-items:center;margin-top:6px;">
        <div ${editable?'style="cursor:pointer" onclick="openModal(\'avatarModal\')"':''}>${avHTML(u,'xl')}</div>
        ${editable?'<div style="font-size:12px;color:var(--ink-soft);margin-top:8px">点头像更换 3D 形象</div>':''}
      </div>
      <div class="pf-fields">
        <label>昵称</label>
        ${editable?`<input class="m-input" id="pfName" value="${esc(u.name)}">`:`<div class="pf-val">${esc(u.name)}</div>`}
        <label>账号 (zoo 号)</label>
        <div class="pf-val">${u.zoo||'—'}</div>
        <label>出生日期</label>
        ${editable?`<input class="m-input" type="date" id="pfBirth" value="${u.birth||''}">`:`<div class="pf-val">${u.birth||'未填写'}</div>`}
      </div>
    </div>
    <div class="modal-foot">
      ${editable
        ? `<button class="pill cream" onclick="closeModal('profileModal')">取消</button><button class="pill green" onclick="saveProfile()">保存</button>`
        : (isMe?`<button class="pill green" onclick="closeModal('profileModal')">关闭</button>`
                :`<button class="pill cream" onclick="closeModal('profileModal')">关闭</button><button class="pill green" onclick="msgFromProfile('${u.id}')">发消息</button>`)}
    </div>`;
  openModal('profileModal');
}
function saveProfile(){const n=document.getElementById('pfName').value.trim();const b=document.getElementById('pfBirth').value;
  if(n)ME.name=n;ME.birth=b;document.getElementById('navMeAv').innerHTML=avHTML(ME,'lg',true);closeModal('profileModal');toast('资料已保存 ✅');}
function msgFromProfile(id){closeModal('profileModal');const f=userById(id);if(f&&f.id!=='me')openSingleChatByFriend(f);}

/* 头像选择 */
function buildAvatarChoices(){const box=document.getElementById('avatarChoices');box.innerHTML='';
  Object.keys(FACE).forEach(k=>{const u={color:'c-'+(k==='bunny'?'bunny':k),img:FACE[k],emoji:'🐾'};
    const map={cat:'🐱',dog:'🐶',wolf:'🐺',croc:'🐊',bear:'🐻',bunny:'🐰',pig:'🐷',tiger:'🐯',fox:'🦊'};u.emoji=map[k];
    const el=document.createElement('div');el.className='member';el.onclick=()=>{ME.img=FACE[k];ME.emoji=map[k];ME.color='c-'+k;
      document.getElementById('navMeAv').innerHTML=avHTML(ME,'lg',true);closeModal('avatarModal');openProfile(ME,true);toast('已更换形象');};
    el.innerHTML=avHTML(u,'md');box.appendChild(el);});}

/* ========================= 查找聊天记录 ========================= */
function openSearch(){document.getElementById('searchInput').value='';renderSearch('');openModal('searchModal');setTimeout(()=>document.getElementById('searchInput').focus(),100);}
function renderSearch(q){q=q.trim();const box=document.getElementById('searchResults');const list=conversations[currentChat]||[];
  if(!q){box.innerHTML='<div style="text-align:center;color:var(--ink-soft);padding:18px;font-size:13px">输入关键词查找本会话消息</div>';return;}
  const hits=list.filter(m=>m.type==='text'&&!m.recalled&&m.text.includes(q));
  if(!hits.length){box.innerHTML='<div style="text-align:center;color:var(--ink-soft);padding:18px;font-size:13px">没有找到相关消息 🔍</div>';return;}
  box.innerHTML='';hits.forEach(m=>{const u=userById(m.from);const el=document.createElement('div');el.className='histitem histem';el.style.cssText='padding:10px 12px;border-radius:14px;cursor:pointer';
    el.onmouseover=()=>el.style.background='var(--cream)';el.onmouseout=()=>el.style.background='';
    const hl=esc(m.text).replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','g'),'<b style="color:var(--yellow-d)">$1</b>');
    el.innerHTML=`<div class="hh" style="display:flex;justify-content:space-between"><span class="who" style="font-weight:800;font-size:13px">${u.name}</span><span class="when" style="font-size:11px;color:var(--ink-soft)">${fmtTime(m.time,'full')}</span></div><div class="txt" style="font-size:13px;color:var(--ink-soft);margin-top:2px">${hl}</div>`;
    el.onclick=()=>jumpTo(m.id);box.appendChild(el);});}
function jumpTo(mid){closeModal('searchModal');
  const row=document.querySelector('.msg[data-id="'+mid+'"]');if(row){row.scrollIntoView({behavior:'smooth',block:'center'});
    const b=row.querySelector('.bubble');if(b){b.classList.remove('flash');void b.offsetWidth;b.classList.add('flash');}}}

/* ========================= 弹窗 / Toast ========================= */
function openModal(id){document.getElementById(id).classList.add('show');}
function closeModal(id){document.getElementById(id).classList.remove('show');}
let toastTimer=null;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1600);}
let promptCb=null;
function promptInput(title,ph,val,cb){document.getElementById('promptTitle').textContent=title;
  const t=document.getElementById('promptText');t.placeholder=ph;t.value=val||'';promptCb=cb;openModal('promptModal');setTimeout(()=>t.focus(),100);}
function confirmPrompt(){const v=document.getElementById('promptText').value.trim();const cb=promptCb;closeModal('promptModal');promptCb=null;if(cb)cb(v);}

/* ========================= 工具 ========================= */
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function pad(n){return n<10?'0'+n:n;}
function fmtTime(d,mode){if(!(d instanceof Date))d=new Date(d);
  const h=pad(d.getHours()),m=pad(d.getMinutes()),s=pad(d.getSeconds());
  if(mode==='full')return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${h}:${m}:${s}`;return `${h}:${m}`;}
function updatePip(){const total=chats.reduce((a,c)=>a+(c.unread||0),0);const p=document.getElementById('navPip');
  if(total>0){p.textContent=total;p.classList.add('show');}else p.classList.remove('show');}

document.addEventListener('click',e=>{const pop=document.getElementById('emojiPop');
  if(pop&&pop.classList.contains('show')&&!pop.contains(e.target)&&!e.target.closest('.tool-ic'))closeEmoji();});

/* init */
document.getElementById('parade').innerHTML=[FACE.croc&&{color:'c-croc',img:FACE.croc,emoji:'🐊'},{color:'c-bunny',img:FACE.bunny,emoji:'🐰'},{color:'c-dog',img:FACE.dog,emoji:'🐶'},{color:'c-tiger',img:FACE.tiger,emoji:'🐯'},{color:'c-wolf',img:FACE.wolf,emoji:'🐺'}].map(u=>avHTML(u,'lg')).join('');
document.getElementById('navMeAv').innerHTML=avHTML(ME,'lg',true);
renderChatList();renderContacts();buildEmoji();buildAvatarChoices();updatePip();
</script>
</body>
